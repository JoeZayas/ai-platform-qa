name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run ESLint
        run: npm run lint
        continue-on-error: true

  app-health-check:
    name: App Health Check
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install app dependencies
        run: cd app && npm install

      - name: Start app server
        run: |
          cd app
          npm start &
          sleep 5

      - name: Health check
        run: |
          curl -f http://localhost:3000/health || exit 1

  api-tests:
    name: API Tests
    runs-on: ubuntu-latest
    needs: app-health-check
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install app dependencies
        run: cd app && npm install

      - name: Start app server
        run: |
          cd app
          npm start &
          sleep 5

      - name: Install test dependencies
        run: pip install -r tests/requirements.txt

      - name: Run API tests
        run: pytest tests/playwright/tests/api -v --tb=short

      - name: Upload API test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: api-test-results
          path: |
            .pytest_cache
            test-results

  ui-tests:
    name: UI Tests
    runs-on: ubuntu-latest
    needs: api-tests
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install app dependencies
        run: cd app && npm install

      - name: Start app server
        run: |
          cd app
          npm start &
          sleep 5

      - name: Install test dependencies
        run: |
          pip install -r tests/requirements.txt
          playwright install chromium

      - name: Run UI tests (Chromium only on CI)
        run: pytest tests/playwright/tests/ui -v --tb=short -m "not slow"

      - name: Upload UI test report
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: playwright-report
          path: |
            test-results
            playwright-report

  agent-unit-tests:
    name: Agent Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install agent dependencies
        run: cd agent && npm install

      - name: Install test dependencies
        run: cd tests && npm install

      - name: Run agent unit tests
        run: npm run test:agents -w tests
        working-directory: .

  agent-integration-tests:
    name: Agent Integration Tests
    runs-on: ubuntu-latest
    needs: [api-tests, agent-unit-tests]
    environment: secrets
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install app dependencies
        run: cd app && npm install

      - name: Install agent dependencies
        run: cd agent && npm install

      - name: Install test dependencies
        run: cd tests && npm install

      - name: Start app server
        run: |
          cd app
          npm start &
          sleep 5

      - name: Start agent server
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LANGCHAIN_API_KEY: ${{ secrets.LANGCHAIN_API_KEY }}
          LANGCHAIN_TRACING_V2: "true"
          LANGCHAIN_PROJECT: "ai-platform-qa-ci"
        run: |
          cd agent
          npm start &
          sleep 5

      - name: Run full workflow tests
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LANGCHAIN_API_KEY: ${{ secrets.LANGCHAIN_API_KEY }}
          LANGCHAIN_TRACING_V2: "true"
          LANGCHAIN_PROJECT: "ai-platform-qa-ci"
        run: npm run test:agents -w tests

  langsmith-evals:
    name: LangSmith Eval Suite
    runs-on: ubuntu-latest
    needs: agent-integration-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: secrets
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install app dependencies
        run: cd app && npm install

      - name: Install agent dependencies
        run: cd agent && npm install

      - name: Start app server
        run: |
          cd app
          npm start &
          sleep 5

      - name: Start agent server
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LANGCHAIN_API_KEY: ${{ secrets.LANGCHAIN_API_KEY }}
          LANGCHAIN_TRACING_V2: "true"
          LANGCHAIN_PROJECT: "ai-platform-qa-ci"
        run: |
          cd agent
          npm start &
          sleep 5

      - name: Install test dependencies
        run: pip install -r tests/requirements.txt

      - name: Create LangSmith dataset
        env:
          LANGCHAIN_API_KEY: ${{ secrets.LANGCHAIN_API_KEY }}
        run: python tests/langsmith-evals/create_dataset.py

      - name: Run evals
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LANGCHAIN_API_KEY: ${{ secrets.LANGCHAIN_API_KEY }}
          LANGCHAIN_TRACING_V2: "true"
          LANGCHAIN_PROJECT: "ai-platform-qa-ci"
        run: python tests/langsmith-evals/run_evals.py

      - name: Run red team tests
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LANGCHAIN_API_KEY: ${{ secrets.LANGCHAIN_API_KEY }}
        run: python tests/langsmith-evals/red_team.py
        continue-on-error: true
